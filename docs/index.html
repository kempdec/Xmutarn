<!DOCTYPE html>
<html lang="pt-br" prefix="og: http://ogp.me/ns#">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Xmutarn é um framework front-end criado com a finalidade de facilitar e aumentar a produtividade na construção de páginas modernas e estilosas.">

  <meta name="theme-color" content="#7B1FA2">

  <!-- Integração com ambiente ~ OpenGraph. -->
  <meta property="og:title" content="Xmutarn">
  <meta property="og:type" content="website">
  <meta property="og:url" content="http://www.xmutarn.com">
  <meta property="og:image" content="http://www.xmutarn.com/assets/img/environment/opengraph.png">
  <meta property="og:description" content="Um framework front-end criado com a finalidade de facilitar e aumentar a produtividade na construção de páginas modernas e estilosas.">
  <meta property="og:site_name" content="Xmutarn">

  <!-- Integração com ambiente ~ Twitter. -->
  <meta name="twitter:image" content="http://www.xmutarn.com/assets/img/environment/twitter.png">

  <title>Xmutarn - Framework front-end moderno, estiloso, fácil e produtivo</title>

  <link rel="shortcut icon" href="assets/img/icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Arquivos de estilo. -->
  <link rel="stylesheet" href="assets/style/xmutarn.min.css">
</head>

<body class="typography-use-default">
  <!-- Barra de ferramentas. -->
  <header class="toolbar">
    <div class="container-fluid">
      <nav class="toolbar--nav">
        <a href="/" class="toolbar--nav--item margin-right-small padding-xsmall">
          <img src="/assets/img/environment/manifest.png" alt="Logotipo do Xmutarn com fundo linear" style="max-height: 2.5rem;">
        </a>
        <a href="/" class="toolbar--nav--item">Início</a>
        <a href="/docs/introduction.html" class="toolbar--nav--item">Documentação</a>
      </nav>
    </div>
  </header>

  <main class="container theme-main-fg-primary">
    <section class="flex-row flex-align-items-center">

      <figure class="flex-col-7 flex-col-8___small flex-col-6___large flex-order-1___large margin-x-auto margin-top-xlarge">
        <img class="max-width-100" src="assets/img/xmutarn-logo-abstract.png" alt="Logotipo do Xmutarn com fundo abstrato">
      </figure>

      <article class="flex-col-6___large typography-align-center">
        <h1 class="typography-headline2 theme-color-fg">Xmutarn</h1>
        <p class="typography-headline5">Moderno, estiloso, fácil e produtivo.</p>
        <a href="docs/introduction.html" class="button button_outlined button_size-xlarge typography-to-uppercase theme-color-bd">
          Começar
        </a>
        <p class="typography-body1 theme-main-fg-secondary">
          Versão: 0.2.0
        </p>
      </article>

    </section>
  </main>
</body>

</html>
